name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Show tool versions
        run: mvn -v

      - name: Build and verify
        run: mvn -B -ntp verify

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: JUnit Tests
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "No JaCoCo report found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          awk -F, 'NR>1 {
            mi+=$4; ci+=$5; mb+=$6; cb+=$7; ml+=$8; cl+=$9
          } END {
            ti = ci + mi; tb = cb + mb; tl = cl + ml
            miss = mi + mb + ml; cov = ci + cb + cl
            pi = ti > 0 ? ci * 100 / ti : 0
            pb = tb > 0 ? cb * 100 / tb : 0
            pl = tl > 0 ? cl * 100 / tl : 0
            pct = (miss + cov) > 0 ? cov * 100 / (miss + cov) : 0
            printf "## JaCoCo Coverage\n\n"
            printf "| Metric | Covered | Total | %% |\n"
            printf "| --- | --- | --- | --- |\n"
            printf "| Instructions | %d | %d | %.1f%% |\n", ci, ti, pi
            printf "| Branches | %d | %d | %.1f%% |\n", cb, tb, pb
            printf "| Lines | %d | %d | %.1f%% |\n", cl, tl, pl
            printf "\n**Total coverage: %.1f%%**\n", pct
          }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
